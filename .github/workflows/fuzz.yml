name: Fuzz

# Longer fuzz runs than the one second per test that normal CI gives them. Each failure prints its seed
# (replay with SNAPPY_FUZZ_SEED) and the failing inputs are uploaded as an artifact.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz test
        default: '120'

jobs:
  fuzz:
    name: Fuzz (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Kept short while the repository is private (Actions minutes are billed); raise when public
      SNAPPY_FUZZ_SECONDS: ${{ github.event.inputs.seconds || '60' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/SnappySimd.Tests -c Release -f net10.0 -- --treenode-filter "/*/*/*FuzzTests/*"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-failures-${{ matrix.name }}
          path: tests/SnappySimd.Tests/bin/Release/net10.0/fuzz-failures/
          if-no-files-found: ignore
